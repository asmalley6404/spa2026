<!doctype html>
<html>
<head>
    <meta name='viewport' content="width=device-width, initial-scale=1">
</head>

<body>
    <!-- PROBLEM 1 -->
	<script>
        // ask user for number, contiue asking until they enter a number 
        do{
            num = prompt("Enter a number: ");
        } while (isNaN(num));
        
        // function will iterate over each number from 1 to 12, 
        // showing the times table for the entered number
        function timesTable(x){
            for (let i = 1; i < 13; i++){
            document.write(x + " x " + i + " = " + i * x + "<br>");
            }
        }

        // run function based on the number entered by user
        timesTable(num);
	</script>
    <br>
    <br>
    <br>

    <!-- PROBLEM 2 -->
     <script>
     function fah2cels(ftemp){
        // fomula found at google.com
        ctemp = (ftemp - 32) * 5/9;
        // limit answer to two decimal places
        ctemp = ctemp.toFixed(2);
        // print result to screen
        document.write("If the Fahrenheit temp is " + ftemp + " degrees, then the Celsius temp is " + ctemp + " degrees.<br>")
     }
     
    // run function several times with different numbers
    fah2cels(0);
    fah2cels(32);
    fah2cels(65);
    fah2cels(112);
	</script>
	
</body>
</html>
